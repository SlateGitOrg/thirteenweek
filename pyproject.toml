[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thirteenweek"
version = "0.1.0"
description = "A 13-week direct cash forecast in live-formula Excel whose receipts follow each contractor's observed pay lag."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "thirteenweek contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "formulas>=1.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
thirteenweek = "thirteenweek.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thirteenweek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
